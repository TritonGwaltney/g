{% extends 'base.html' %}

{%block body%}
<div class="content">
    <h1 style="text-align: center; font-family: plainview display;">Your <br> Ratings</h1>
    <h4 style="color:rgb(161, 0, 32); text-align: center;font-family: Arial, sans-serif;"> <a href="/index">Exit</a></h4>

    <div class ='addRating'>
        <a style = "align-items: center; margin-left: auto; margin-right: auto;" href="{{ url_for('addRating', username=username) }}">Add Rating</a>
            
        </a>  
    </div>      




    <br>
    <form>


    </form>
    <div class ='Table'>
        <table style="margin-left: auto; margin-right: auto; text-align: center; width: 500px; border: 1px solid black; border-collapse: collapse;">
            <tr>
                <th style="border: 1px solid black;width: 400px;">Name</th>
                <th style="border: 1px solid black;width: 100px;">Rating</th>
                <th style="border: 1px solid black;width: 100px;">Actions</th>
            </tr>
            {% for data in media %}
            <tr>
                
                <td style="text-align: left; border: 1px solid black;width: 400px;">{{ data.name }}</td>
                <td style="border: 1px solid black;width: 100px;">{{ data.rating }}</td>
                <td style="border: 1px solid black;width: 100px;">
                    <a href="{{ url_for('editRating', username=username, rating_id=data.id) }}">Edit</a>
                    <a href="{{ url_for('delete', username=username, rating_id=data.id) }}" onclick="return confirm('Are you sure you want to delete this rating?')">Delete</a>
                </td>
            </tr>
            {% endfor %}
        
            
        </table>
        

            
    </div>
    
</div> 

{%endblock%}
